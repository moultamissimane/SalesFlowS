spring:
  application:
    name: salesflow-api
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  health:
    mail:
      enabled: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

salesflow:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-this-should-be-at-least-256-bits-long-for-hs256}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  mail:
    from: SalesFlow CRM <no-reply@salesflow.ma>
  frontend:
    reset-password-url: ${FRONTEND_URL:http://localhost:3000}/reset-password

logging:
  level:
    com.salesflow.api: INFO
    org.hibernate.SQL: WARN

